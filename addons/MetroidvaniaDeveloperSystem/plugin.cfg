[plugin]

name="Metroidvania Developer System"
description="Metroidvania world builder for Godot 4: draw and connect irregular rooms on a map, paint their terrain, freeform rock and stamps in a Room view, check rooms with physics, auto-create gates, analyze progression and backtracking, and run the world with room-to-room transitions, a room camera, area titles, music, objectives, dark rooms and 2.5D. Works with or without MetSys."
author="Arun Soundararajan"
version="2.2"
script="plugin.gd"
