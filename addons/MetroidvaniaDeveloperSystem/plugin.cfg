[plugin]

name="Metroidvania Developer System"
description="Metroidvania world builder for Godot 4: draw and connect irregular rooms on a map, paint their terrain, freeform rock and stamps in a Room view, auto-create gates, analyze progression and backtracking, and run the world with room-to-room transitions and a room camera. Works with or without MetSys."
author="Arun Soundararajan"
version="2.1"
script="plugin.gd"
