[plugin]

name="Metroidvania Developer System"
description="Metroidvania world builder and gameplay kit for Godot 4: draw and connect irregular rooms on a map, paint their terrain, freeform rock and stamps in a Room view (or trace them from a drawing), add weather, hazards and scenery (dust storms, rain, lightning, snow, steam vents, lava, waterfalls, Silksong-style silk threads, wisps, void tendrils, cobwebs, swaying grass...) and parallax, animated or creature backgrounds, check rooms with physics, auto-create gates, analyze progression and backtracking, run the world with transitions and room camera, and build full gameplay with responsive movement, abilities, combat, enemies, bosses, economy, inventory, equipment, checkpoints, benches, and UI. Works with or without MetSys."
author="Arun Soundararajan"
version="3.4.0"
script="plugin.gd"
