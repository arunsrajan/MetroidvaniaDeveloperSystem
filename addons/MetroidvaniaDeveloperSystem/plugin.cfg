[plugin]

name="Metroidvania Developer System"
description="Metroidvania world builder for Godot 4: draw and connect irregular rooms on a map, paint their terrain, freeform rock and stamps in a Room view (or trace them from a drawing), add weather, hazards and scenery (dust storms, rain, lightning, snow, steam vents, lava, waterfalls, Silksong-style silk threads, wisps, void tendrils, cobwebs, swaying grass...) and parallax or animated shader backgrounds (20 soft, out-of-focus styles, boss rooms included) by area, by room or by drag and drop, check rooms with physics, auto-create gates, analyze progression and backtracking, and run the world with room-to-room transitions, a room camera, area titles, music, objectives, dark rooms and 2.5D. Works with or without MetSys."
author="Arun Soundararajan"
version="3.1"
script="plugin.gd"
